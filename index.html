<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股虛擬投資帳戶</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2129;--sub:#6b7280;--line:#e5e7eb;--up:#d93025;--down:#188038;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1f27;--text:#e8eaed;--sub:#9aa0a6;--line:#2c313b;--up:#ff6b61;--down:#4cc38a;--accent:#6ea0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat small{color:var(--sub);display:block}
.stat b{font-size:18px}
.up{color:var(--up)}.down{color:var(--down)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end}
label{font-size:12px;color:var(--sub);display:block}
input,select,button{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
button{cursor:pointer;background:var(--accent);color:#fff;border:0}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.sell{background:var(--down)}button.buy{background:var(--up)}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{width:auto;padding:6px 12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{color:var(--sub);font-weight:500}
td input{width:90px;padding:3px 6px;text-align:right}
.msg{font-size:13px;color:var(--sub);margin-top:8px;min-height:18px}
.err{color:var(--up)}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📈 台股虛擬投資帳戶</h1>

  <div class="card"><div class="grid" id="stats"></div></div>

  <div class="card">
    <h2>績效</h2>
    <div class="grid" id="perf" style="margin-bottom:10px"></div>
    <svg id="chart" viewBox="0 0 600 180" style="width:100%;height:auto;display:block"></svg>
  </div>

  <div class="card">
    <h2>下單</h2>
    <form id="orderForm">
      <div><label>股票代號</label><input id="sym" required placeholder="2330" inputmode="numeric"></div>
      <div><label>名稱(選填)</label><input id="name" placeholder="台積電"></div>
      <div><label>價格</label><input id="price" type="number" step="0.01" min="0.01" required></div>
      <div><label>股數(1張=1000股)</label><input id="qty" type="number" step="1" min="1" required value="1000"></div>
      <div><label>類型</label>
        <select id="kind"><option value="stock">一般股票(賣出稅0.3%)</option><option value="etf">ETF(賣出稅0.1%)</option></select></div>
      <div><button type="button" class="buy" onclick="trade('buy')">買進</button></div>
      <div><button type="button" class="sell" onclick="trade('sell')">賣出</button></div>
    </form>
    <div class="msg" id="msg"></div>
    <div class="hint">手續費 0.1425%×折扣(低消 20 元);證交稅僅賣出時收取。買賣會依下方設定計算。</div>
  </div>

  <div class="card">
    <h2>持股 <span class="hint">(現價可手動修改,或按「更新股價」從證交所抓收盤價)</span></h2>
    <div class="tools" style="margin-bottom:8px"><button onclick="fetchPrices()">更新股價</button></div>
    <div class="scroll"><table id="pos"></table></div>
  </div>

  <div class="card">
    <h2>交易紀錄</h2>
    <div class="scroll"><table id="log"></table></div>
  </div>

  <div class="card">
    <h2>帳戶設定</h2>
    <form id="setForm" onsubmit="return false">
      <div><label>初始資金(重置時套用)</label><input id="cap" type="number" min="1" value="1000000"></div>
      <div><label>手續費折扣(例:0.6=六折)</label><input id="disc" type="number" step="0.01" min="0" max="1" value="1"></div>
      <div><button class="ghost" onclick="saveSettings()">儲存折扣</button></div>
      <div><button class="ghost" onclick="resetAcct()">重置帳戶</button></div>
      <div><button class="ghost" onclick="exportData()">匯出 JSON</button></div>
      <div><button class="ghost" onclick="document.getElementById('imp').click()">匯入 JSON</button></div>
    </form>
    <input type="file" id="imp" accept=".json" hidden>
  </div>
</div>

<script>
const KEY='tw-paper-account-v1';
const fresh=cap=>({cash:cap,initial:cap,disc:1,pos:{},log:[],realized:0,hist:[{t:Date.now(),eq:cap}]});
let S=load();

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s.cash==='number'){if(!s.hist)s.hist=[{t:Date.now(),eq:s.initial}];return s}}catch(e){}return fresh(1000000)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const cls=n=>n>0?'up':n<0?'down':'';
const sgn=n=>(n>0?'+':'')+fmt(n);
const fee=amt=>Math.max(20,Math.floor(amt*0.001425*S.disc));
function msg(t,err){const m=$('msg');m.textContent=t;m.className='msg'+(err?' err':'')}

function trade(side){
  const sym=$('sym').value.trim(),price=parseFloat($('price').value),qty=parseInt($('qty').value,10);
  if(!sym||!(price>0)||!(qty>0))return msg('請填寫完整的代號、價格與股數',true);
  const amt=Math.round(price*qty),f=fee(amt);
  let p=S.pos[sym];
  if(side==='buy'){
    const cost=amt+f;
    if(cost>S.cash)return msg(`現金不足:需要 ${fmt(cost)},目前 ${fmt(S.cash)}`,true);
    S.cash-=cost;
    if(!p)p=S.pos[sym]={name:$('name').value.trim(),qty:0,cost:0,last:price,kind:$('kind').value};
    if($('name').value.trim())p.name=$('name').value.trim();
    p.qty+=qty;p.cost+=cost;p.last=price;p.kind=$('kind').value;
    S.log.unshift({t:Date.now(),side,sym,name:p.name,price,qty,fee:f,tax:0,pnl:null});
    msg(`已買進 ${sym} ${fmt(qty)} 股,成本 ${fmt(cost)}`);
  }else{
    if(!p||p.qty<qty)return msg(`持股不足:${sym} 目前 ${p?fmt(p.qty):0} 股`,true);
    const tax=Math.floor(amt*(($('kind').value==='etf'||p.kind==='etf')?0.001:0.003));
    const net=amt-f-tax,basis=p.cost*qty/p.qty,pnl=net-basis;
    S.cash+=net;S.realized+=pnl;p.cost-=basis;p.qty-=qty;p.last=price;
    if(p.qty===0)delete S.pos[sym];
    S.log.unshift({t:Date.now(),side,sym,name:p.name,price,qty,fee:f,tax,pnl});
    msg(`已賣出 ${sym} ${fmt(qty)} 股,實現損益 ${sgn(pnl)}`);
  }
  snap();save();render();
}

function snap(){
  let mv=0;for(const p of Object.values(S.pos))mv+=p.last*p.qty;
  const pt={t:Date.now(),eq:S.cash+mv},h=S.hist,l=h[h.length-1];
  if(l&&pt.t-l.t<60000)h[h.length-1]=pt;else h.push(pt);
  if(h.length>2000)h.splice(1,h.length-2000);
}
function setLast(sym,v){const x=parseFloat(v);if(x>0){S.pos[sym].last=x;snap();save();render()}}
function sellAllOf(sym){const p=S.pos[sym];$('sym').value=sym;$('qty').value=p.qty;$('price').value=p.last;$('kind').value=p.kind||'stock';window.scrollTo({top:0,behavior:'smooth'})}

function render(){
  let mv=0,cost=0;
  for(const p of Object.values(S.pos)){mv+=p.last*p.qty;cost+=p.cost}
  const eq=S.cash+mv,total=eq-S.initial,unreal=mv-cost;
  $('stats').innerHTML=[
    ['總資產',fmt(eq),''],['現金',fmt(S.cash),''],['持股市值',fmt(mv),''],
    ['未實現損益',sgn(unreal),cls(unreal)],['已實現損益',sgn(S.realized),cls(S.realized)],
    ['總報酬',sgn(total)+` (${(total/S.initial*100).toFixed(2)}%)`,cls(total)]
  ].map(([k,v,c])=>`<div class="stat"><small>${k}</small><b class="${c}">${v}</b></div>`).join('');

  const rows=Object.entries(S.pos).map(([sym,p])=>{
    const v=p.last*p.qty,u=v-p.cost;
    return `<tr><td class="l">${sym} ${esc(p.name||'')}</td><td>${fmt(p.qty)}</td><td>${(p.cost/p.qty).toFixed(2)}</td>
    <td><input type="number" step="0.01" value="${p.last}" onchange="setLast('${sym}',this.value)"></td>
    <td>${fmt(v)}</td><td class="${cls(u)}">${sgn(u)}</td><td class="${cls(u)}">${(u/p.cost*100).toFixed(2)}%</td>
    <td><button class="ghost" style="padding:3px 8px" onclick="sellAllOf('${sym}')">帶入賣出</button></td></tr>`}).join('');
  $('pos').innerHTML=`<tr><th class="l">股票</th><th>股數</th><th>均價(含費)</th><th>現價</th><th>市值</th><th>損益</th><th>報酬率</th><th></th></tr>`+(rows||'<tr><td class="l" colspan="8">目前沒有持股</td></tr>');

  $('log').innerHTML=`<tr><th class="l">時間</th><th class="l">買/賣</th><th class="l">股票</th><th>價格</th><th>股數</th><th>手續費</th><th>證交稅</th><th>實現損益</th></tr>`+
    (S.log.map(l=>`<tr><td class="l">${new Date(l.t).toLocaleString('zh-TW',{hour12:false})}</td><td class="l ${l.side==='buy'?'up':'down'}">${l.side==='buy'?'買進':'賣出'}</td>
    <td class="l">${l.sym} ${esc(l.name||'')}</td><td>${l.price}</td><td>${fmt(l.qty)}</td><td>${fmt(l.fee)}</td><td>${fmt(l.tax)}</td>
    <td class="${cls(l.pnl)}">${l.pnl==null?'-':sgn(l.pnl)}</td></tr>`).join('')||'<tr><td class="l" colspan="8">尚無交易</td></tr>');
  $('cap').value=S.initial;$('disc').value=S.disc;
  renderPerf();
}
function renderPerf(){
  const sells=S.log.filter(l=>l.side==='sell'),w=sells.filter(l=>l.pnl>0),ls=sells.filter(l=>l.pnl<=0);
  let peak=-Infinity,mdd=0;
  for(const h of S.hist){peak=Math.max(peak,h.eq);mdd=Math.max(mdd,(peak-h.eq)/peak)}
  const avg=a=>a.length?a.reduce((x,y)=>x+y.pnl,0)/a.length:0;
  $('perf').innerHTML=[
    ['交易筆數',S.log.length,''],
    ['勝率',sells.length?(w.length/sells.length*100).toFixed(1)+'%':'-',''],
    ['平均獲利',w.length?sgn(avg(w)):'-','up'],['平均虧損',ls.length?sgn(avg(ls)):'-','down'],
    ['最大回撤',(mdd*100).toFixed(2)+'%','']
  ].map(([k,v,c])=>`<div class="stat"><small>${k}</small><b class="${c}">${v}</b></div>`).join('');
  const H=S.hist,W=600,Ht=180,pad=6;
  const t0=H[0].t,t1=H[H.length-1].t||t0+1,span=Math.max(t1-t0,1);
  const ys=H.map(h=>h.eq).concat(S.initial),lo=Math.min(...ys),hi=Math.max(...ys),r=Math.max(hi-lo,1);
  const X=t=>pad+(t-t0)/span*(W-2*pad),Y=v=>Ht-pad-(v-lo)/r*(Ht-2*pad);
  const pts=H.length>1?H.map(h=>X(h.t).toFixed(1)+','+Y(h.eq).toFixed(1)).join(' '):`${pad},${Y(H[0].eq)} ${W-pad},${Y(H[0].eq)}`;
  const up=H[H.length-1].eq>=S.initial,col=up?'var(--up)':'var(--down)';
  $('chart').innerHTML=`<line x1="${pad}" x2="${W-pad}" y1="${Y(S.initial)}" y2="${Y(S.initial)}" stroke="var(--line)" stroke-dasharray="4"/>
  <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2"/>
  <text x="${pad}" y="12" font-size="11" fill="var(--sub)">${fmt(hi)}</text><text x="${pad}" y="${Ht-10}" font-size="11" fill="var(--sub)">${fmt(lo)}</text>`;
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function fetchPrices(){
  const syms=Object.keys(S.pos);
  if(!syms.length)return msg('沒有持股可更新');
  msg('更新中…');
  try{
    const r=await fetch('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL');
    const d=await r.json();let n=0;
    for(const x of d){const p=S.pos[x.Code];const c=parseFloat(x.ClosingPrice);if(p&&c>0){p.last=c;if(!p.name)p.name=x.Name;n++}}
    snap();save();render();msg(`已更新 ${n}/${syms.length} 檔(上市股票收盤價;上櫃請手動輸入)`);
  }catch(e){msg('無法取得股價(可能被瀏覽器或網路擋下),請手動輸入現價',true)}
}

function saveSettings(){const d=parseFloat($('disc').value);if(d>=0&&d<=1){S.disc=d;save();msg('已儲存手續費折扣')}else msg('折扣需介於 0~1',true)}
function resetAcct(){
  const cap=parseFloat($('cap').value);
  if(!(cap>0))return msg('初始資金需大於 0',true);
  if(!confirm(`確定重置?所有持股與紀錄會清空,資金重設為 ${fmt(cap)}。`))return;
  const d=S.disc;S=fresh(cap);S.disc=d;save();render();msg('帳戶已重置')
}
function exportData(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='tw-paper-account.json';a.click();URL.revokeObjectURL(a.href)
}
$('imp').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{const s=JSON.parse(t);if(typeof s.cash!=='number'||!s.pos||!s.log)throw 0;S=s;save();render();msg('匯入成功')}).catch(()=>msg('檔案格式不正確',true));
  e.target.value=''
};
render();
</script>
</body>
</html>
